<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>withLoveHanooode | Paintings and Crafts</title>
    <link rel="stylesheet" href="..\global\base.css" />
    <link rel="stylesheet" href="..\global\navbar.css" />
    <link rel="stylesheet" href="shop.css" />
  </head>
  <nav class="paint-nav" aria-label="Main navigation">
    <div class="paint-nav-swatches" id="paintNavSwatches">
      <a class="paint-swatch paint-swatch-1" href="index.html">
        <img
          class="swatch-image swatch-basic"
          src="..\assets\navigation\swatch-basic.webp"
          alt=""
        />
        <img
          class="swatch-image swatch-colour"
          src="..\assets\navigation\blue.webp"
          alt=""
        />
        <span>Portfolio</span>
      </a>

      <a class="paint-swatch paint-swatch-3" href="shop.html">
        <img
          class="swatch-image swatch-basic"
          src="..\assets\navigation\swatch-basic.webp"
          alt=""
        />
        <img
          class="swatch-image swatch-colour"
          src="..\assets\navigation\yellow.webp"
          alt=""
        />
        <span>Shop</span>
      </a>
    </div>

    <!-- Palette menu button -->
    <button
      class="paint-palette-button"
      id="paintPaletteButton"
      aria-label="navigation menu"
      aria-expanded="false"
      aria-controls="paintNavSwatches"
    >
      <img
        class="palette-image palette-basic"
        src="..\assets\navigation\palette-basic.webp"
        alt="pallete paint menu closed"
      />

      <img
        class="palette-image palette-colour"
        src="..\assets\navigation\palette-colour.webp"
        alt="pallete paint menu open"
      />
    </button>
  </nav>
</html>
